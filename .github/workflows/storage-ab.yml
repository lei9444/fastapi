name: Prepare targeted httptools upgrade

on:
  push:
    branches:
      - lei9444-fastapi-platform-ci
    paths:
      - .github/workflows/storage-ab.yml
      - scripts/storage_ab.py
      - scripts/tests/test_storage_ab.py
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  prepare:
    name: Generate the lock and check helpers without storage operations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"
          architecture: x64
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Generate and verify the single-package lock update
        shell: bash
        run: |
          mkdir upgrade-evidence
          cp uv.lock upgrade-evidence/before.lock
          uv --version | tee upgrade-evidence/uv-version.txt
          python --version | tee upgrade-evidence/python-version.txt
          uv lock --upgrade-package httptools==0.9.0 --python 3.13.17 2>&1 | tee upgrade-evidence/lock.log
          cp uv.lock upgrade-evidence/uv.lock
          uv lock --check
          python - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path
          root = Path("upgrade-evidence")
          before = tomllib.loads((root / "before.lock").read_text())
          after = tomllib.loads((root / "uv.lock").read_text())
          old_packages = before.pop("package")
          new_packages = after.pop("package")
          assert before == after, "Unexpected lock metadata drift"
          assert [p for p in old_packages if p["name"] != "httptools"] == [
              p for p in new_packages if p["name"] != "httptools"
          ], "Unexpected changes to other packages"
          old = [p for p in old_packages if p["name"] == "httptools"]
          new = [p for p in new_packages if p["name"] == "httptools"]
          assert len(old) == len(new) == 1
          assert old[0]["version"] == "0.7.1" and new[0]["version"] == "0.9.0"
          assert new[0]["source"] == old[0]["source"] == {"registry": "https://pypi.org/simple"}
          wheel = [w for w in new[0]["wheels"] if w["url"].endswith("httptools-0.9.0-cp313-cp313-win_arm64.whl")]
          assert len(wheel) == 1
          assert wheel[0]["hash"] == "sha256:bfdabac0c6d3d6a5be8c2a100a001c92c14a39bbafd5999545a675c493626e64"
          receipt = {
              "command": "uv lock --upgrade-package httptools==0.9.0 --python 3.13.17",
              "uv": (root / "uv-version.txt").read_text().strip(),
              "python": (root / "python-version.txt").read_text().strip(),
              "changed_packages": {"httptools": ["0.7.1", "0.9.0"]},
              "other_packages_unchanged": len(new_packages) - 1,
              "before_sha256": hashlib.sha256((root / "before.lock").read_bytes()).hexdigest(),
              "after_sha256": hashlib.sha256((root / "uv.lock").read_bytes()).hexdigest(),
              "windows_arm64_wheel": wheel[0],
          }
          (root / "lock-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Format and check upgrade evidence helpers
        shell: bash
        run: |
          quality="$RUNNER_TEMP/httptools-upgrade-quality"
          uv venv --python 3.13.17 "$quality"
          uv pip install --python "$quality/bin/python" ruff==0.16.8 ty==0.0.78 pytest==9.1.1 psutil==7.2.2
          "$quality/bin/ruff" check --fix scripts/storage_ab.py scripts/tests/test_storage_ab.py
          "$quality/bin/ruff" format scripts/storage_ab.py scripts/tests/test_storage_ab.py
          git diff --binary -- scripts/storage_ab.py scripts/tests/test_storage_ab.py > upgrade-evidence/format.patch
          "$quality/bin/ty" check --python "$quality/bin/python" scripts/storage_ab.py scripts/tests/test_storage_ab.py
          "$quality/bin/python" -m pytest -c /dev/null --rootdir . --strict-config --strict-markers -W error -p no:cacheprovider scripts/tests/test_storage_ab.py scripts/tests/test_isolated_platform_ci.py scripts/tests/test_platform_ci.py -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: httptools-upgrade-inputs
          path: upgrade-evidence
          if-no-files-found: error
          retention-days: 7
