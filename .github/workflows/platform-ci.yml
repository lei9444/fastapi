name: Platform CI reference report

on:
  push:
    branches:
      - lei9444-fastapi-platform-ci
    paths-ignore:
      - .github/workflows/isolated-platform-ci.yml
      - .github/isolated-build-requirements.txt
      - .github/isolated-platform-ci.md
      - scripts/isolated_platform_ci.py
      - scripts/tests/test_isolated_platform_ci.py
      - .github/workflows/storage-ab.yml
      - .github/storage-ab.md
      - scripts/storage_ab.py
      - scripts/storage_ab.ps1
      - scripts/storage_ab_core.psm1
      - scripts/storage_ab_native.psm1
      - scripts/tests/storage_ab_guards.ps1
      - scripts/tests/test_storage_ab.py
  workflow_dispatch:

permissions: {}

env:
  UV_NO_SYNC: true
  UV_PYTHON_DOWNLOADS: never
  UV_PYTHON: "3.13.17"
  INLINE_SNAPSHOT_DEFAULT_FLAGS: review
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Test (${{ matrix.platform }}, repetition ${{ matrix.repetition }})
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, windows-arm64, linux-x64, macos-arm64]
        repetition: [1, 2, 3]
        include:
          - platform: windows-x64
            runner: windows-2025
            architecture: x64
          - platform: windows-arm64
            runner: windows-11-arm
            architecture: arm64
          - platform: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - platform: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
          architecture: ${{ matrix.architecture }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          enable-cache: false
      - name: Install dependencies, build distributions, and test
        run: python scripts/platform_ci.py run
        env:
          PLATFORM: ${{ matrix.platform }}
          REPETITION: ${{ matrix.repetition }}
          RUNNER_LABEL: ${{ matrix.runner }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      - name: Check reporting helper
        if: ${{ !cancelled() && matrix.platform == 'linux-x64' && matrix.repetition == 1 }}
        run: |
          status=0
          uv run --no-sync ruff check scripts/platform_ci.py scripts/tests/test_platform_ci.py || status=1
          uv run --no-sync ruff format --diff scripts/platform_ci.py scripts/tests/test_platform_ci.py || status=1
          uv run --no-sync ty check scripts/platform_ci.py scripts/tests/test_platform_ci.py || status=1
          exit "$status"
      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-result-${{ matrix.platform }}-${{ matrix.repetition }}-${{ github.run_attempt }}
          path: platform-results/${{ matrix.platform }}-${{ matrix.repetition }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  report:
    name: Aggregate reference report
    if: always()
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
          architecture: x64
      - name: Download platform evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-result-*-${{ github.run_attempt }}
          path: platform-artifacts
      - name: Publish summary and CSV
        if: always()
        run: python scripts/platform_ci.py report --input platform-artifacts --output platform-report
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-report-${{ github.run_attempt }}
          path: platform-report
          if-no-files-found: error
          retention-days: 7
